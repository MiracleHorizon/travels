<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2557d6" />
    <title>Нет подключения — Travels</title>
    <style>
      :root { color: #18213d; background: #f7f8fc; font-family: Inter, system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: 1.75rem; }
      p { color: #58627d; line-height: 1.55; }
      button { margin-top: .75rem; border: 0; border-radius: .7rem; padding: .75rem 1rem; background: #2557d6; color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Пока нет интернета</h1>
      <p>Проверьте подключение и попробуйте ещё раз. Ранее открытые поездки останутся доступны в приложении.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
